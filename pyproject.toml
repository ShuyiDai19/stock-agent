[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-agent"
version = "0.1.0"
description = "A safety-first stock trading agent with deterministic risk controls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "keyring>=25,<26",
    "exchange-calendars>=4.13.2,<5",
]

[tool.setuptools.packages.find]
where = ["src"]